schema = 1
description = "Qwen3.8-27B Q4 with MTP speculative decoding, one 64K slot for a single agent: the default"
model_set = "qwen3.8-27b-ud-q4-k-xl"

[server]
ctx_size = 65536
n_predict = 16384
# MTP drafting works with one slot only; a second client queues behind the
# first. The default: with an extension set and xhigh reasoning, a 32K slot
# is the smallest that takes the largest request, so one 64K slot beats
# two 32K slots for the single agent most sessions are.
parallel = 1
gpu_layers = 99
flash_attn = "auto"
cache_type_k = "q8_0"
cache_type_v = "q8_0"
spec_type = "draft-mtp"
spec_draft_n_max = 3
ctx_checkpoints = 8
reasoning_effort = "xhigh"
reasoning_efforts = ["low", "medium", "xhigh"]

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[requires]
vram_gib = 24
