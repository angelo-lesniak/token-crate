schema = 1
description = "Qwen3.8-27B Q4: two 128K slots so two clients, such as the chat UI and an agent, share one loaded model"
model_set = "qwen3.8-27b-ud-q4-k-xl"

# No MTP: drafting works with one slot only, so each slot generates at
# about the plain decoding speed.
[server]
# Total context; each of the two slots gets half.
ctx_size = 262144
n_predict = 32768
parallel = 2
gpu_layers = 99
flash_attn = "auto"
cache_type_k = "q8_0"
cache_type_v = "q8_0"
ctx_checkpoints = 16
reasoning_effort = "xhigh"
reasoning_efforts = ["low", "medium", "xhigh"]

[sampling]
# Qwen's recommended thinking-mode sampling.
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[requires]
vram_gib = 31
