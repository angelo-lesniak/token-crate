schema = 1
description = "GLM-5.3-Flash UD-Q2_K_XL, experts in system memory: the 96 GB RAM tier"
model_set = "glm-5.3-flash-ud-q2-k-xl"

# The Unsloth guide's settings (https://unsloth.ai/docs/models/glm-5.3-flash)
# fitted to a 32 GB card with 96 GB of RAM; the card ends at about 31 GB.
# When a llama.cpp update stops the load with cudaMalloc out of memory,
# raise n_cpu_moe one layer at a time. Keep the memory map: load-mode =
# "none" copies the weights into memory the kernel cannot reclaim and
# swaps a 96 GB host to a standstill.
[server]
ctx_size = 131072
n_predict = 16384
parallel = 1
gpu_layers = 99
# The weights are 108.7 GB and experts are about 2.2 GB per layer at this
# quant, so 38 of the 45 layers keep their experts in system memory (78 GiB
# of the 93 GiB a 96 GB host reports); each layer more moves 2.2 GB off
# the card.
n_cpu_moe = 38
# Off, the attention scratch grows with context times micro-batch: 17 GiB
# on the card at 128K and a 512 micro-batch.
flash_attn = "on"
cache_type_k = "f16"
cache_type_v = "f16"
# The 34 linear-attention layers cannot KV-shift, like Qwen's DeltaNet
# layers, so checkpoints are how earlier prompt work is reused.
ctx_checkpoints = 8
# The file carries the NextN layer; about two of three draft tokens are
# accepted.
spec_type = "draft-mtp"
spec_draft_n_max = 2
batch_size = 2048
# A 2048 micro-batch leaves the MTP draft context 1.4 GiB short on the card.
ubatch_size = 512
# Thinking is always on: reasoning_effort in {low, high, max} through the
# template, no enable_thinking switch. pi lists max as a level and oh-my-pi
# rounds an unknown level up, so the efforts need no map change.
reasoning_effort = "high"
reasoning_efforts = ["low", "high", "max"]
thinking_toggle = false

# The Unsloth guide's defaults; no top_k or min_p guidance is published.
[sampling]
temperature = 1.0
top_p = 0.95

[requires]
vram_gib = 30
ram_gib = 96
