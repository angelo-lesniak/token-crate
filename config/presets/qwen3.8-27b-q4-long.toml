schema = 1
description = "Qwen3.8-27B Q4 with one 128K slot: for oh-my-pi and long agent sessions; no speculative decoding"
model_set = "qwen3.8-27b-ud-q4-k-xl"

[server]
ctx_size = 131072
n_predict = 16384
parallel = 1
gpu_layers = 99
flash_attn = "auto"
cache_type_k = "q8_0"
cache_type_v = "q8_0"
ctx_checkpoints = 16
reasoning_effort = "xhigh"
reasoning_efforts = ["low", "medium", "xhigh"]

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[requires]
vram_gib = 28
