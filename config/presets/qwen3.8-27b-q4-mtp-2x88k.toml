schema = 1
description = "Qwen3.8-27B Q4 with MTP and two 88K slots, sized to leave room for the judge service"
model_set = "qwen3.8-27b-ud-q4-k-xl"

# Each slot keeps its own KV cache and drafts on its own.
# On an RTX 5090 llama-server holds about 25.1 GiB, which leaves 0.9 to
# 1.4 GiB free beside the judge service with both slots full, by what the
# desktop takes.
[server]
# Total context; each slot gets ctx_size / parallel.
ctx_size = 180224
n_predict = 32768
parallel = 2
gpu_layers = 99
flash_attn = "auto"
cache_type_k = "q8_0"
cache_type_v = "q8_0"
spec_type = "draft-mtp"
spec_draft_n_max = 3
ctx_checkpoints = 16
reasoning_effort = "xhigh"
reasoning_efforts = ["low", "medium", "xhigh"]

[sampling]
# Qwen's recommended thinking-mode sampling.
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[requires]
vram_gib = 28
