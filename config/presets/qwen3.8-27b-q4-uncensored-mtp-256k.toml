schema = 1
description = "Qwen3.8-27B Q4 uncensored (abliterated by huihui-ai), refusals removed at the weight level, with MTP and one 256K slot"
model_set = "qwen3.8-27b-huihui-abliterated-ud-q4-k-xl"

# The settings of qwen3.8-27b-q4-mtp-256k on the abliterated file, with
# the reasoning-loop risk that qwen3.8-27b-q4-uncensored-mtp-128k names.
[server]
ctx_size = 262144
n_predict = 32768
parallel = 1
gpu_layers = 99
flash_attn = "auto"
cache_type_k = "q8_0"
cache_type_v = "q8_0"
spec_type = "draft-mtp"
spec_draft_n_max = 3
ctx_checkpoints = 32
reasoning_effort = "xhigh"
reasoning_efforts = ["low", "medium", "xhigh"]

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[requires]
vram_gib = 31
