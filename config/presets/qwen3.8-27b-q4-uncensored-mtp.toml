schema = 1
description = "Qwen3.8-27B Q4 uncensored (abliterated by huihui-ai), refusals removed at the weight level, with MTP"
model_set = "qwen3.8-27b-huihui-abliterated-ud-q4-k-xl"

# The settings of qwen3.8-27b-q4-mtp on the abliterated file. Known quality
# risk: in a benchmark of eight uncensored Qwen3.8-27B variants
# (https://nathan.sapwell.net/posts/qwen38-27b-abliteration/, 2026-09-06)
# huihui's placed third (76 percent compliance, KL about 0.07 against the
# original) and every variant looped in its reasoning in 30 to 45 percent
# of runs; the "reply terminates" check of `smoke` shows a loop when one of
# its two completions hits it, so run `smoke` more than once.
# docs/validation.md records the smoke checks, memory use, and speed
# on each tested llama.cpp build.
[server]
ctx_size = 65536
n_predict = 16384
parallel = 1
gpu_layers = 99
flash_attn = "auto"
cache_type_k = "q8_0"
cache_type_v = "q8_0"
spec_type = "draft-mtp"
spec_draft_n_max = 3
ctx_checkpoints = 8
reasoning_effort = "xhigh"
reasoning_efforts = ["low", "medium", "xhigh"]

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[requires]
vram_gib = 24
