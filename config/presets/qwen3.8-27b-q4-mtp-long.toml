schema = 1
description = "Qwen3.8-27B Q4 with MTP speculative decoding and one 128K slot: the default's speed for long agent sessions"
model_set = "qwen3.8-27b-ud-q4-k-xl"

# qwen3.8-27b-q4-long with the default preset's MTP drafting: the 128K
# slot for oh-my-pi and long sessions, at the drafting speed of
# qwen3.8-27b-q4-mtp. Only the 16 full-attention layers hold a KV cache,
# so the larger slot costs about 2 GiB in q8_0 over the 64K presets and
# the MTP layer about 6 percent more; [requires] is the 128K preset's
# value. docs/validation.md records the smoke checks, memory use, and
# speed on each tested llama.cpp build.
[server]
ctx_size = 131072
n_predict = 16384
parallel = 1
gpu_layers = 99
flash_attn = "auto"
cache_type_k = "q8_0"
cache_type_v = "q8_0"
spec_type = "draft-mtp"
spec_draft_n_max = 3
ctx_checkpoints = 16
reasoning_effort = "xhigh"
reasoning_efforts = ["low", "medium", "xhigh"]

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[requires]
vram_gib = 28
