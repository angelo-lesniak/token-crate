schema = 1
description = "Qwen3.8-27B Q4 with MTP and one 256K slot, the model's trained context: the longest sessions"
model_set = "qwen3.8-27b-ud-q4-k-xl"

# qwen3.8-27b-q4-mtp-128k with the slot at the model's trained context
# (262,144 tokens, max_position_embeddings of Qwen/Qwen3.8-27B); a larger
# slot would need RoPE scaling. The cache grows by about 2.1 GiB per 64K
# in q8_0, so this preset holds about 6 GiB more than the 128K one.
[server]
ctx_size = 262144
n_predict = 32768
parallel = 1
gpu_layers = 99
flash_attn = "auto"
cache_type_k = "q8_0"
cache_type_v = "q8_0"
spec_type = "draft-mtp"
spec_draft_n_max = 3
ctx_checkpoints = 32
reasoning_effort = "xhigh"
reasoning_efforts = ["low", "medium", "xhigh"]

[sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
min_p = 0.0
presence_penalty = 0.0

[requires]
vram_gib = 31
