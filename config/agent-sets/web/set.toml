schema = 1
description = "TypeScript 6.0.3, typescript-language-server 6.0.3, and the Vue 3.3.14 language tools and vue-tsc"
note = "node with typescript, typescript-language-server, and vue-tsc. npm install needs --egress. For .vue files run `vue-tsc --noEmit`."
# TypeScript stays on 6 until a stable vue-tsc supports 7 (Vue's language
# tools 4, which need TypeScript 7.1): 7 ships no lib/tsc, on which vue-tsc
# crashes, and no tsserver, so the move also replaces
# typescript-language-server with 7's own `tsc --lsp --stdio`.
check = [
  "typescript-language-server --version >/dev/null",
  "vue-tsc --version >/dev/null",
  'echo "typescript-language-server $(typescript-language-server --version) and $(vue-tsc --version) answer --version"',
]

[npm]

[env]
PATH = "/opt/tokencrate/sets/web/node_modules/.bin"
