schema = 1
description = "Paseo, a daemon with a browser UI that runs several pi sessions at once; start it with `ui paseo`"
build = ["install -m 0755 tokencrate-ui-paseo /usr/local/bin/tokencrate-ui-paseo"]
check = [
  "paseo --version >/dev/null",
  'echo "paseo $(paseo --version | head -1) answers --version"',
]

[npm]

[env]
PATH = "/opt/tokencrate/sets/paseo/node_modules/.bin"

[ui]
command = "tokencrate-ui-paseo"
port = 6767
state = ".paseo"
host_port = 4250
