schema = 1
description = "Odin dev-2026-10 with OLS dev-2026-10 (language server) and odinfmt, clang 19 as the linker, lldb-dap 19 (debug adapter), SDL2, Vulkan, and glslc"
# clang is Odin's linker on Linux (the LLVM 19 one, shared with lldb); the
# X11 and OpenGL development packages are what the prebuilt raylib in the
# Odin release links against.
apt = [
  "clang-19",
  "glslc",
  "libgl1-mesa-dev",
  "libsdl2-dev",
  "libvulkan-dev",
  "libx11-dev",
  "libxcursor-dev",
  "libxi-dev",
  "libxinerama-dev",
  "libxrandr-dev",
  "lldb-19",
]
# The build fails unless the pinned compiler links and runs a program.
build = [
  "chmod 0755 /opt/ols/ols-x86_64-unknown-linux-gnu /opt/ols/odinfmt-x86_64-unknown-linux-gnu",
  "ln -s /opt/ols/ols-x86_64-unknown-linux-gnu /opt/ols/ols",
  "ln -s /opt/ols/odinfmt-x86_64-unknown-linux-gnu /opt/ols/odinfmt",
  "ln -s /usr/bin/clang-19 /usr/local/bin/clang",
  "ln -s /usr/bin/lldb-dap-19 /usr/local/bin/lldb-dap",
  "printf 'package main\\nimport \"core:fmt\"\\nmain :: proc() { fmt.println(\"ok\") }\\n' > /tmp/hello.odin",
  "odin run /tmp/hello.odin -file -out:/tmp/hello",
  "rm -f /tmp/hello /tmp/hello.odin",
]
check = [
  '''printf 'package main\nimport "core:fmt"\nmain :: proc() { fmt.println("ok") }\n' > "$CHECK_DIR/hello.odin"''',
  'odin run "$CHECK_DIR/hello.odin" -file -out:"$CHECK_DIR/hello" | grep -q "^ok$"',
  'echo "$(odin version | head -1) builds and runs a program"',
]
note = """odin (ODIN_ROOT=/opt/odin; vendor raylib and lua are prebuilt there), ols (language server), odinfmt, clang (linker), lldb-dap (debug adapter: pass adapter lldb-dap after `odin build -debug`).
SDL2, Vulkan headers and loader, glslc. There is no display: SDL uses its dummy drivers; window-creating code cannot be run here."""

# Odin and OLS stay on the same monthly tag and are upgraded together.
[[asset]]
url = "https://github.com/odin-lang/Odin/releases/download/dev-2026-10/odin-linux-amd64-dev-2026-10.tar.gz"
sha256 = "c3c8b095621fd0c75f7f73e3a0829f1b4d45324225f20ba11ed8dc4da310a8ab"
into = "/opt/odin"
strip = 1

[[asset]]
url = "https://github.com/DanielGavin/ols/releases/download/dev-2026-10/ols-x86_64-unknown-linux-gnu.zip"
sha256 = "1ee224fcd7b0818acf2e2160e5d4e380d89261d9d96328c9b0a1cb8cc193bb7f"
into = "/opt/ols"

[env]
PATH = "/opt/odin:/opt/ols"
ODIN_ROOT = "/opt/odin"
SDL_VIDEODRIVER = "dummy"
SDL_AUDIODRIVER = "dummy"

[pi_lens.lsp.servers.ols]
name = "Odin Language Server"
extensions = [".odin"]
command = "ols"
args = []
