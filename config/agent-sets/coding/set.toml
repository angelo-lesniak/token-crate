schema = 1
description = "The pi coding extensions: pi-lens code intelligence, plan mode, and the advisor"
# Edits go through pi's own edit tool: hashline anchors add 10 KB to every
# request, and oh-my-pi turns its own off for Qwen 3.8 and GLM-5.3-Flash.
# pi names an extension that fails to load, but exits 0 either way.
check = [
  'out=$(pi --list-models 2>&1)',
  'if grep -F "Failed to load extension" <<<"$out"; then exit 1; fi',
  'echo "pi loads pi-lens, plan mode, and the advisor"',
]
pi_packages = [
  "node_modules/pi-lens",
  "node_modules/@narumitw/pi-plan-mode",
  "node_modules/@juicesharp/rpiv-advisor",
]
note = "Run lens_diagnostics after editing source files. Extra tools (lsp_navigation, ast_grep_*) load through pi_lens_activate_tools."

[npm]
omit_peer = true

# pi-lens's effective_config tool only describes pi-lens's own settings.
# The project and module reports are orientation reports from pi-lens's
# review graph; their schemas would go out with every request.
[pi_lens.tools.effective_config]
enabled = false

[pi_lens.tools.project_report]
enabled = false

[pi_lens.tools.module_report]
enabled = false
