# The 4-bit tier of Unsloth's table (https://unsloth.ai/docs/models/qwen3.8-next):
# KL 0.047 and 92.3 percent top-1, the same class as the shipped 27B Q4;
# UD-IQ4_XS (93.7 GB, 0.084, 89.6 percent) is the lighter option. Every
# quant keeps the n-gram table at 4 bits (about 29 GB); llama.cpp reads its
# rows on demand through the memory map, so it need not stay resident.
# Header read at the pinned commit: architecture qwen4exp (in llama.cpp since
# 2026-08-27, so the pinned build loads it), and the embedded chat template
# is byte for byte the 27B's (9,993 characters, the same digest), so the
# shipped patched template applies. The MTP layer needs an open llama.cpp
# pull request (28243) and separate draft files, so mtp stays false.
mtp = false
chat_template_file = "qwen3.8-27b-agent.jinja"

