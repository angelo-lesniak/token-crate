schema = 1
description = "GLM-5.3-Flash (320B total, 18B active; hybrid linear and sparse attention, MIT), Unsloth UD-Q2_K_XL in 4 parts (108.7 GB): the 96 GB RAM tier"
upstream_model = "zai-org/GLM-5.3-Flash"
model_card = "https://huggingface.co/unsloth/GLM-5.3-Flash-GGUF/blob/a38483c8cd5df544f53d70fb281afe97369d5ab6/README.md"
# The largest quant that fits a 32 GB card plus 96 GB of RAM with margin:
# the card takes about 24 GB of weights after the cache and buffers, which
# leaves 79 GiB of the 93 GiB the host reports for the rest. Unsloth's own
# table (https://unsloth.ai/docs/models/glm-5.3-flash): UD-Q2_K_XL at KL
# 0.380 and 78.3 percent top-1; UD-IQ3_XXS (120.4 GB, 0.284, 81.6 percent)
# would leave no margin at all on this split; UD-IQ2_XXS (101.8 GB, 0.450,
# 76.3 percent) is the fallback if this one turns out tight. The GGUF
# header names the architecture glm5-next, and part 4 carries the NextN
# (MTP) layer as four blk.45.nextn tensors. The repository moves often;
# the pin is the commit of 2026-10-05.
mtp = true

# The first build with the MTP head the preset drafts with.
[requires]
llama_build = "b11474"

