description = "Qwen3.8-Flash-Next uncensored (orcarouter's refusal removal), plain Q4_K_S in 3 parts (111.8 GB), Qwen Community License, gated repository: the 96 GB RAM tier"
upstream_model = "Qwen/Qwen3.8-Flash-Next"
