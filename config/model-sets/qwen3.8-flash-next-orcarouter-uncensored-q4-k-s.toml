# The most downloaded uncensored build of this model when it was pinned
# (198K downloads and 341 likes against 52.6K and 75 for huihui-ai's), by the
# method that placed first of eight in a benchmark of uncensored
# Qwen3.8-27B builds (https://nathan.sapwell.net/posts/qwen38-27b-abliteration/);
# nobody has benchmarked it on Flash-Next. Plain llama.cpp quants, not
# Unsloth's dynamic ones; at 4 bits the n-gram table keeps its 4-bit floor
# either way. The repository is gated with automatic approval: accept its
# terms on Hugging Face and set HF_TOKEN before models fetch. Read from
# the card and the GGUF header with a token: the method is abliteration, the
# architecture is qwen4exp, and the embedded chat template is not the
# Unsloth file's (8,952 characters against 9,993), so the patched template
# below replaces a different original; the first smoke run shows whether
# the file works with it. The repository tags
# itself Apache-2.0; the weights derive from Qwen3.8-Flash-Next, whose
# license is linked below.
mtp = false
chat_template_file = "qwen3.8-27b-agent.jinja"

