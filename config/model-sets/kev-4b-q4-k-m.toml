schema = 1
description = "Kev-4B Q4_K_M (3.0 GB), a decision model for llama.cpp's /v1/systemone that the judge service runs; no preset loads it"
upstream_model = "jaredpalmer/kev-4b"
model_card = "https://huggingface.co/ggml-org/Kev-4B-GGUF/blob/f4624b6bb7072f1bab726a622c1cad3f96030b9e/README.md"
# Kev's LoRA and decision head on Qwen3.5-4B-Base, converted into one GGUF
# (decision type kev). It answers only /v1/systemone and generates no text,
# so it is no router preset: the router keeps one model loaded, and a
# judgment would swap the session's model out.
mtp = false

